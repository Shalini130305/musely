<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="musely-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181820" />
      <stop offset="100%" stop-color="#0E0E12" />
    </linearGradient>
    <linearGradient id="musely-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6CA9" />
      <stop offset="100%" stop-color="#FF388B" />
    </linearGradient>
  </defs>
  <!-- Background Tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#musely-bg)" stroke="#303039" stroke-width="2"/>
  
  <!-- Stylized M Monogram -->
  <!-- Left Pillar & Diagonal (White) -->
  <path d="M16 48 L16 16 L32 37" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right Diagonal & Pillar (MUSELY Signature Electric Pink) -->
  <path d="M32 37 L48 16 L48 48" fill="none" stroke="url(#musely-pink)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Center Accent Glow Dot -->
  <circle cx="32" cy="37" r="3" fill="#FF4F9A" />
</svg>